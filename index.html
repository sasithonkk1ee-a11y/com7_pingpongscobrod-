<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&family=Orbitron:wght@700;900&family=Kanit:wght@700;900&display=swap" rel="stylesheet">
  <title>COM7 PING PONG LEAGUE 2026</title>
  <style>
    /* ใช้ Orbitron สำหรับ Latin, Anuphan สำหรับไทย */
    @font-face {
      font-family: 'PlayerFont';
      src: local('Anuphan');
      unicode-range: U+0E00-U+0E7F; /* Thai */
      font-weight: 700 900;
    }
    @font-face {
      font-family: 'PlayerFont';
      src: local('Orbitron');
      unicode-range: U+0000-U+00FF; /* Latin */
      font-weight: 700 900;
    }

    html, body {
      width: 100%; height: 100%;
      background: #060d18;
      font-family: 'Anuphan', sans-serif;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #222 #060d18;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #060d18; }
    ::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a2a4e; }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100vw;
    }

    /* ทำให้ scoreboard section เต็มจอ */
    .scoreboard-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      text-align: center;
      padding: 22px 20px 8px;
      height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 100%);
      flex-shrink: 0;
    }
    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.5rem, 3.2vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 6px;
      background: linear-gradient(90deg, #00c853, #69ff47, #00c853);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 16px rgba(0,200,80,0.7));
    }
    .header .subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.55rem, 0.9vw, 0.8rem);
      color: #444;
      letter-spacing: 8px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* SCOREBOARD */
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 220px 1fr;
      height: calc(100dvh - 80px);
      min-height: 400px;
    }

    /* PLAYER PANEL */
    .player-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 24px 28px;
      position: relative;
      gap: 2px;
    }
    .p1 { background: linear-gradient(135deg, rgba(200,0,0,0.16) 0%, rgba(200,0,0,0.03) 100%); }
    .p2 { background: linear-gradient(225deg, rgba(0,120,255,0.16) 0%, rgba(0,120,255,0.03) 100%); }

    .serving-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.1rem, 1.8vw, 1.6rem);
      letter-spacing: 4px;
      color: #ffcc00;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.3s;
      text-shadow: 0 0 12px rgba(255,204,0,0.7);
      margin-top: 36px;
      margin-bottom: 6px;
    }
    .player-panel.serving .serving-badge { opacity: 1; }

    .player-name {
      font-family: 'PlayerFont', 'Orbitron', 'Anuphan', sans-serif;
      font-size: clamp(2.5rem, 6vw, 6rem);
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s;
      line-height: 1.4;
      padding-top: 0.15em;   
      white-space: nowrap;
      overflow: visible;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .p1 .player-name { color: #ff2222; }
    .p2 .player-name { color: #42a8ff; }
    .player-name:hover { opacity: 0.6; }

    .name-hint {
      font-family: 'Anuphan', sans-serif;
      font-size: 0.7rem; color: rgba(255,255,255,0.38); letter-spacing: 1px;
      margin-top: -4px;
    }

    /* SCORE */
    .score-label {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.55rem, 0.8vw, 0.7rem);
      letter-spacing: 4px; color: #3a3a3a;
      text-transform: uppercase;
      margin-top: 4px;
    }
    /* SCORE wrapper */
    .score-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .score-value {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(4rem, 30vw, 54vh);
      font-weight: 900;
      line-height: 0.85;
      transform-origin: center center;
      display: inline-block;
      white-space: nowrap;
      transition: transform 0.2s ease;
      pointer-events: none;
      will-change: transform;
      transform: scaleY(1.35);
    }
    .p1 .score-value { color: #ff2222; text-shadow: 0 0 20px rgba(255,34,34,0.3); }
    .p2 .score-value { color: #42a8ff; text-shadow: 0 0 20px rgba(66,168,255,0.3); }
    .score-value.bump { filter: brightness(1.3); }

    /* SCORE BUTTONS */
    .score-btns { display: flex; gap: 24px; justify-content: center; width: 100%; margin-top: 16px; }
    .btn-score {
      width: 52px; height: 52px;
      border: none; border-radius: 50%;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      cursor: pointer; transition: transform 0.1s;
      text-align: center;
      line-height: 1;
      background: transparent;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-score:active { transform: scale(0.92); }
    .btn-minus { color: rgba(255,255,255,0.25); }
    .btn-minus:hover { color: rgba(255,255,255,0.6); }
    .p1 .btn-plus { color: rgba(255,255,255,0.25); }
    .p1 .btn-plus:hover { color: rgba(255,255,255,0.6); }
    .p2 .btn-plus { color: rgba(255,255,255,0.25); }
    .p2 .btn-plus:hover { color: rgba(255,255,255,0.6); }

    /* CENTER COLUMN */
    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0,0,0,0.28);
    }
    .vs-badge {
      width: 130px; height: 130px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(200,0,0,0.3), rgba(0,120,255,0.3));
      border: 1px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem; font-weight: 700;
      color: #fff;
      text-shadow: 0 0 8px rgba(255,255,255,0.5);
    }
    .center-sets-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem; letter-spacing: 3px; color: #3a3a3a;
    }
    .center-sets-score { display: flex; align-items: center; gap: 10px; }
    .center-sets-num {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(4rem, 7vw, 7rem);
      font-weight: 900; line-height: 1;
    }
    .center-sets-num.p1c { color: #ff2222; text-shadow: 0 0 18px rgba(255,34,34,0.35); }
    .center-sets-num.p2c { color: #42a8ff; text-shadow: 0 0 18px rgba(66,168,255,0.35); }
    .center-sets-sep { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 4vw, 3.5rem); color: #2a2a2a; font-weight: 700; }
    .set-num-label {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.8rem, 1.2vw, 1.1rem); letter-spacing: 3px; color: #383838;
    }
    .deuce-indicator {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.62rem; font-weight: 900; letter-spacing: 3px;
      color: #ff4444;
      background: rgba(255,68,68,0.1);
      border: 1px solid rgba(255,68,68,0.35);
      border-radius: 20px; padding: 3px 12px;
      animation: pulse-red 0.8s infinite alternate;
    }
    @keyframes pulse-red {
      from { box-shadow: 0 0 4px rgba(255,68,68,0.2); }
      to   { box-shadow: 0 0 14px rgba(255,68,68,0.65); }
    }

    /* FOOTER */
    .footer {
      background: rgba(0,0,0,0.5);
      border-top: 1px solid rgba(255,255,255,0.06);
      min-height: 200vh;
      padding-bottom: 60px;
    }
    .controls {
      display: flex; gap: 10px;
      justify-content: center;
      padding: 40px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .btn-ctrl {
      flex: 1;
      max-width: 220px;
      padding: clamp(8px,1vh,12px) 10px;
      border: none; border-radius: 10px;
      font-family: 'Anuphan', sans-serif;
      font-size: clamp(0.8rem, 1vw, 0.95rem);
      font-weight: 700;
      cursor: pointer; transition: transform 0.1s;
      text-align: center;
      white-space: nowrap;
      color: #fff;
    }
    .btn-ctrl:active { transform: scale(0.94); }
    .btn-save-set { background: linear-gradient(135deg, #1a9e3f, #17b978); }
    .btn-save-set:hover { opacity: 0.85; }
    .btn-swap { background: #3a3a3a; }
    .btn-swap:hover { background: #4a4a4a; }
    .btn-reset-score { background: #7a6000; }
    .btn-reset-score:hover { background: #9a7a00; }
    .btn-reset-all { background: #6b1a22; }
    .btn-reset-all:hover { background: #8b2230; }

    /* HISTORY */
    .history-section { padding: 30px 30px 40px; }
    .history-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem; letter-spacing: 4px; color: #303030;
      text-align: center; margin-bottom: 6px;
    }
    .history-table { width: 100%; border-collapse: collapse; font-size: clamp(0.78rem, 0.95vw, 0.92rem); }
    .history-table th {
      background: rgba(255,255,255,0.04); color: #505050; font-weight: 600;
      padding: 5px 12px; text-align: center; font-size: 0.7rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      font-family: 'Anuphan', sans-serif;
    }
    .history-table td {
      padding: 5px 12px; text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.04); color: #aaa;
      font-family: 'Anuphan', sans-serif;
    }
    .winner-cell { color: #ffcc00; font-weight: 700; }
    .history-empty { text-align: center; color: #2e2e2e; font-size: 0.82rem; padding: 8px; font-family: 'Anuphan', sans-serif; }

    /* WIN OVERLAY */
    .win-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.92); z-index: 200;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 24px;
    }
    .win-overlay.show { display: flex; }
    .win-text {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 7vw, 5rem); font-weight: 900;
      color: #ffcc00; text-align: center;
      animation: pulse-gold 1s infinite alternate;
    }
    .win-sub { color: #666; font-size: clamp(0.9rem, 1.4vw, 1.15rem); text-align: center; font-family: 'Anuphan', sans-serif; }
    .btn-close-overlay {
      padding: 14px 44px;
      background: linear-gradient(135deg, #cc0000, #ffcc00);
      color: #000; border: none; border-radius: 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.85rem, 1.2vw, 1.05rem);
      font-weight: 700; cursor: pointer; letter-spacing: 3px;
    }
    .btn-close-overlay:hover { opacity: 0.85; }
    @keyframes pulse-gold {
      from { filter: drop-shadow(0 0 12px #ffcc00); }
      to   { filter: drop-shadow(0 0 40px #ffcc00) brightness(1.3); }
    }

    @media (min-width: 1600px) {
      .header h1 { font-size: 3.5rem; }
      .player-name { font-size: clamp(3rem, 5vw, 5rem); }
      .serving-badge { font-size: 1.8rem; }
      .score-label { font-size: 0.9rem; }
      .center-sets-num { font-size: 8rem; }
      .center-sets-sep { font-size: 4rem; }
      .vs-badge { width: 160px; height: 160px; font-size: 2.2rem; }
      .set-num-label { font-size: 1.2rem; }
      .center-sets-label { font-size: 1rem; }
      .btn-ctrl { font-size: 1.1rem; padding: 14px 20px; max-width: 280px; }
      .btn-score { width: 70px; height: 70px; font-size: 2rem; }
      .history-table { font-size: 1.1rem; }
      .history-table th { font-size: 0.9rem; padding: 8px 16px; }
      .history-table td { padding: 8px 16px; }
    }

    @media (min-width: 1920px) {
      .header h1 { font-size: 4rem; }
      .player-name { font-size: clamp(3.5rem, 5vw, 5.5rem); }
      .serving-badge { font-size: 2rem; }
      .center-sets-num { font-size: 10rem; }
      .vs-badge { width: 180px; height: 180px; font-size: 2.5rem; }
      .scoreboard { grid-template-columns: 1fr 280px 1fr; }
      .score-value { font-size: clamp(4rem, 30vw, 54vh); }
    }

    @media (max-width: 600px) {
      html, body { overflow: auto; }
      .app { height: auto; }
      .scoreboard { grid-template-columns: 1fr; }
      .center-col { flex-direction: row; padding: 14px 20px; }
      .controls { flex-wrap: wrap; }
      .btn-ctrl { max-width: none; }
    }
  </style>
</head>
<body>

<div class="win-overlay" id="winOverlay">
  <div class="win-text" id="winText"></div>
  <div class="win-sub"  id="winSub"></div>
  <button class="btn-close-overlay" onclick="closeOverlay()">CONTINUE</button>
</div>

<div class="app">

  <div class="header">
    <h1>COM7 PING PONG LEAGUE 2026</h1>
    <div class="subtitle">Scoreboard</div>
  </div>

  <div class="scoreboard">

    <div class="player-panel p1" id="panel1">
      <div class="serving-badge"></div>
      <div class="player-name" id="name1" onclick="editName(1)">PLAYER 1</div>
      <div class="name-hint"></div>
      <div class="score-label">SCORE</div>
      <div class="score-wrapper">
        <div class="score-value" id="score1">0</div>
      </div>
      <div class="score-btns">
        <button class="btn-score btn-minus" onclick="changeScore(1,-1)">&#8722;</button>
        <button class="btn-score btn-plus"  onclick="changeScore(1,+1)">+</button>
      </div>
    </div>

    <div class="center-col">
      <div class="vs-badge">VS</div>
      <div class="center-sets-label">SETS WON</div>
      <div class="center-sets-score">
        <span class="center-sets-num p1c" id="sets1">0</span>
        <span class="center-sets-sep">:</span>
        <span class="center-sets-num p2c" id="sets2">0</span>
      </div>
      <div class="set-num-label">SET <span id="setNumDisplay">1</span></div>
      <div class="deuce-indicator" id="deuceIndicator" style="display:none;">DEUCE</div>
    </div>

    <div class="player-panel p2" id="panel2">
      <div class="serving-badge"></div>
      <div class="player-name" id="name2" onclick="editName(2)">PLAYER 2</div>
      <div class="name-hint"></div>
      <div class="score-label">SCORE</div>
      <div class="score-wrapper">
        <div class="score-value" id="score2">0</div>
      </div>
      <div class="score-btns">
        <button class="btn-score btn-minus" onclick="changeScore(2,-1)">&#8722;</button>
        <button class="btn-score btn-plus"  onclick="changeScore(2,+1)">+</button>
      </div>
    </div>

  </div>

  <div class="footer">
    <div class="controls">
      <button class="btn-ctrl btn-save-set"    onclick="saveSet()">บันทึกเซ็ต + สลับฝั่ง</button>
      <button class="btn-ctrl btn-swap"        onclick="swapSides()">สลับฝั่ง</button>
      <button class="btn-ctrl btn-reset-score" onclick="resetScore()">รีเซ็ตคะแนน</button>
      <button class="btn-ctrl btn-reset-all"   onclick="resetAll()">รีเซ็ตทั้งหมด</button>
    </div>
    <div class="history-section">
      <div class="history-title">SET HISTORY</div>
      <div class="history-empty" id="historyEmpty">ยังไม่มีประวัติเซ็ต</div>
      <table class="history-table" id="historyTable" style="display:none;">
        <thead>
          <tr>
            <th>SET</th>
            <th id="hName1">PLAYER 1</th>
            <th id="hName2">PLAYER 2</th>
            <th>ผู้ชนะเซ็ต</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const state = {
    score: [0,0], sets: [0,0],
    names: ['PLAYER 1','PLAYER 2'],
    serving: 1, firstServer: 1,
    history: [], setCount: 0, winSets: 3
  };

  function render() {
    document.getElementById('score1').textContent = state.score[0];
    document.getElementById('score2').textContent = state.score[1];
    document.getElementById('sets1').textContent  = state.sets[0];
    document.getElementById('sets2').textContent  = state.sets[1];
    document.getElementById('name1').textContent  = state.names[0];
    document.getElementById('name2').textContent  = state.names[1];
    document.getElementById('hName1').textContent = state.names[0];
    document.getElementById('hName2').textContent = state.names[1];
    document.getElementById('setNumDisplay').textContent = state.setCount + 1;
    document.getElementById('panel1').classList.toggle('serving', state.serving === 1);
    document.getElementById('panel2').classList.toggle('serving', state.serving === 2);
    requestAnimationFrame(fitScores);
  }

  // วัดขนาดจริงแล้ว scale ให้พอดี wrapper เสมอ
  function fitScores() {
    ['score1','score2'].forEach(id => {
      const el = document.getElementById(id);
      const wrapper = el.parentElement;
      if (!wrapper) return;

      // 1. reset transform ก่อนวัดขนาดจริง
      el.style.transition = 'none';
      el.style.transform = 'none';

      // 2. วัดหลัง reset
      const elW  = el.offsetWidth;
      const boxW = wrapper.clientWidth;

      // 3. คำนวณ scaleX ไม่ให้ล้น เผื่อ margin 5%
      const sx = Math.min(1, (boxW * 0.92) / elW);

      // 4. apply พร้อม scaleY stretch
      requestAnimationFrame(() => {
        el.style.transition = 'transform 0.2s ease';
        el.style.transform  = `scaleX(${sx}) scaleY(1.35)`;
      });
    });
  }

  function changeScore(player, delta) {
    const i = player - 1;
    state.score[i] = Math.max(0, state.score[i] + delta);
    const el = document.getElementById('score' + player);
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 180);
    updateServing();
    checkDeuce();
    render();
  }

  function updateServing() {
    const [s1, s2] = state.score;
    const total = s1 + s2;
    const isDeuce = s1 >= 10 && s2 >= 10;
    if (isDeuce) {
      const pts = total - 20;
      state.serving = (pts % 2 === 0) ? state.firstServer : (state.firstServer === 1 ? 2 : 1);
    } else {
      const block = Math.floor(total / 2);
      state.serving = (block % 2 === 0) ? state.firstServer : (state.firstServer === 1 ? 2 : 1);
    }
  }

  function checkDeuce() {
    const [s1, s2] = state.score;
    const isDeuce = s1 >= 10 && s2 >= 10 && s1 === s2;
    document.getElementById('deuceIndicator').style.display = isDeuce ? 'block' : 'none';
  }

  function isSetWinner(s1, s2) {
    if (s1 >= 11 && s1 - s2 >= 2) return 0;
    if (s2 >= 11 && s2 - s1 >= 2) return 1;
    return -1;
  }

  function saveSet() {
    const [s1, s2] = state.score;
    if (s1 === 0 && s2 === 0) { alert('คะแนนยังเป็น 0 ทั้งคู่'); return; }
    const winIdx = isSetWinner(s1, s2);
    if (winIdx === -1) {
      if (!confirm('คะแนน ' + s1 + '-' + s2 + ' ยังไม่ถึงเงื่อนไขชนะเซ็ต\n(ต้องได้อย่างน้อย 11 แต้ม และนำห่าง 2 แต้ม)\n\nบันทึกต่อไปหรือไม่?')) return;
    }
    state.setCount++;
    const winner = winIdx >= 0 ? state.names[winIdx] : 'เสมอ';
    if (winIdx >= 0) state.sets[winIdx]++;
    state.history.push({ set: state.setCount, s1, s2, winner, winIdx });
    renderHistory();
    if (state.sets[0] >= state.winSets || state.sets[1] >= state.winSets)
      showWin(state.sets[0] >= state.winSets ? state.names[0] : state.names[1]);
    state.score = [0, 0];
    const nextServer = winIdx >= 0 ? winIdx + 1 : state.serving;
    state.firstServer = nextServer;
    state.serving = nextServer;
    document.getElementById('deuceIndicator').style.display = 'none';
    swapSides(true);
    render();
  }

  function swapSides(silent) {
    [state.names[0], state.names[1]] = [state.names[1], state.names[0]];
    [state.score[0], state.score[1]] = [state.score[1], state.score[0]];
    [state.sets[0],  state.sets[1]]  = [state.sets[1],  state.sets[0]];
    state.serving     = state.serving     === 1 ? 2 : 1;
    state.firstServer = state.firstServer === 1 ? 2 : 1;
    render();
  }

  function resetScore() {
    state.score = [0, 0];
    updateServing(); checkDeuce(); render();
  }

  function resetAll() {
    if (!confirm('รีเซ็ตทั้งหมด? ประวัติเซ็ตจะถูกลบด้วย')) return;
    Object.assign(state, { score:[0,0], sets:[0,0], names:['PLAYER 1','PLAYER 2'], serving:1, firstServer:1, history:[], setCount:0 });
    document.getElementById('deuceIndicator').style.display = 'none';
    renderHistory(); render();
  }

  function editName(player) {
    const i = player - 1;
    const n = prompt('ชื่อผู้เล่น ' + player + ':', state.names[i]);
    if (n && n.trim()) { state.names[i] = n.trim().toUpperCase(); render(); }
  }

  function renderHistory() {
    const table = document.getElementById('historyTable');
    const empty = document.getElementById('historyEmpty');
    if (!state.history.length) { table.style.display='none'; empty.style.display='block'; return; }
    table.style.display = 'table'; empty.style.display = 'none';
    document.getElementById('historyBody').innerHTML = state.history.map(h => `
      <tr>
        <td>${h.set}</td>
        <td class="${h.winIdx===0?'winner-cell':''}">${h.s1}</td>
        <td class="${h.winIdx===1?'winner-cell':''}">${h.s2}</td>
        <td class="winner-cell">${h.winner}</td>
      </tr>`).join('');
  }

  function showWin(name) {
    // ปิด overlay ไม่แสดง
  }

  function closeOverlay() {
    document.getElementById('winOverlay').classList.remove('show');
  }

  render();

  // refit เมื่อ resize หรือ fullscreen เปลี่ยน
  window.addEventListener('resize', () => requestAnimationFrame(fitScores));
  document.addEventListener('fullscreenchange', () => requestAnimationFrame(fitScores));
</script>
</body>
</html>
